services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: talkpal
      MYSQL_DATABASE: talkpal
      MYSQL_USER: talkpal
      MYSQL_PASSWORD: talkpal
    ports: ["3306:3306"]
    volumes: [mysqldata:/var/lib/mysql]
volumes:
  mysqldata:
